# Varre o site do campus em busca de portarias novas e grava como pendentes
# para revisão no sistema. Também pode ser rodado à mão na aba "Actions".
name: Varrer portarias do site

on:
  schedule:
    - cron: '0 11 * * 1-5'   # dias úteis, 8h (horário de Brasília)
  workflow_dispatch:

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node robo/varrer-portarias.js
        env:
          ROBO_EMAIL: ${{ secrets.ROBO_EMAIL }}
          ROBO_SENHA: ${{ secrets.ROBO_SENHA }}
